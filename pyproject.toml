[project]
name = "distribute"
version = "1.0.0"
description = "Make distributing tasks easier."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "David Charatan", email = "charatan@mit.edu"},
]
urls = {repository = "https://github.com/dcharatan/distribute" }
dependencies = ["psycopg2-binary", "backoff"]

[project.optional-dependencies]
# Needed only by dashboard.py, which is not part of the importable package.
dashboard = ["dash", "dash-bootstrap-components"]

[dependency-groups]
# example.py and example_worker.py import beartype; dashboard.py needs the dashboard
# extra. `uv sync` installs the dev group by default, so both come along for free.
dev = ["beartype", "ruff", "distribute[dashboard]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["distribute.py"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes `E` and `F` codes by default.
select = ["E", "F", "I"]
ignore = ["F722"] # Ignore F722 for jaxtyping compatibility.

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []

per-file-ignores = {}

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10
